name: Deploy Google Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-cloud-run-production
  cancel-in-progress: false

env:
  REGION: europe-west1
  REPOSITORY: nova-org

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure project and required APIs
        env:
          PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com
          gcloud artifacts repositories describe "$REPOSITORY" --location "$REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPOSITORY" --repository-format=docker --location "$REGION"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push images
        env:
          PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
        run: |
          set -euo pipefail
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/nova-api:${GITHUB_SHA}"
          BOT_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/nova-bot:${GITHUB_SHA}"
          docker build -f Dockerfile.api -t "$API_IMAGE" .
          docker build -f Dockerfile.bot -t "$BOT_IMAGE" .
          docker push "$API_IMAGE"
          docker push "$BOT_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "BOT_IMAGE=$BOT_IMAGE" >> "$GITHUB_ENV"
      - name: Sync production secrets to Secret Manager
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WORK_SIGNING_SECRET: ${{ secrets.WORK_SIGNING_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL REDIS_URL JWT_SECRET SESSION_SECRET WORK_SIGNING_SECRET INTERNAL_API_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "Required GitHub secret is missing: ${name}"
              exit 1
            fi
            gcloud secrets describe "$name" >/dev/null 2>&1 || gcloud secrets create "$name" --replication-policy=automatic
            printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=- >/dev/null
          done
      - name: Deploy API
        env:
          PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud run deploy nova-api --image "$API_IMAGE" --region "$REGION" --platform managed \
            --allow-unauthenticated --min-instances 0 --max-instances 2 --port 8080 \
            --set-env-vars 'NODE_ENV=production,APP_URL=https://app.ilmora.space,ADMIN_URL=https://admin.ilmora.space,API_URL=https://api.ilmora.space,TELEGRAM_BOT_USERNAME=NovaOrgBot,TRUST_PROXY_HOPS=1' \
            --set-secrets 'DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET=JWT_SECRET:latest,SESSION_SECRET=SESSION_SECRET:latest,WORK_SIGNING_SECRET=WORK_SIGNING_SECRET:latest,INTERNAL_API_SECRET=INTERNAL_API_SECRET:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest'
          API_RUN_URL="$(gcloud run services describe nova-api --region "$REGION" --format='value(status.url)')"
          echo "API_RUN_URL=$API_RUN_URL" >> "$GITHUB_ENV"
      - name: Run production migrations
        run: |
          set -euo pipefail
          gcloud run jobs deploy nova-db-migrate --image "$API_IMAGE" --region "$REGION" \
            --command npx --args 'prisma,migrate,deploy,--schema,packages/db/prisma/schema.prisma' \
            --set-secrets 'DATABASE_URL=DATABASE_URL:latest' --max-retries 0 --task-timeout 10m
          gcloud run jobs execute nova-db-migrate --region "$REGION" --wait
      - name: Deploy bot
        run: |
          set -euo pipefail
          gcloud run deploy nova-bot --image "$BOT_IMAGE" --region "$REGION" --platform managed \
            --allow-unauthenticated --min-instances 0 --max-instances 1 --port 8080 \
            --set-env-vars 'NODE_ENV=production,APP_URL=https://app.ilmora.space,ADMIN_URL=https://admin.ilmora.space,API_URL=https://api.ilmora.space,TELEGRAM_BOT_USERNAME=NovaOrgBot,TRUST_PROXY_HOPS=1' \
            --set-secrets 'DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SECRET=JWT_SECRET:latest,SESSION_SECRET=SESSION_SECRET:latest,WORK_SIGNING_SECRET=WORK_SIGNING_SECRET:latest,INTERNAL_API_SECRET=INTERNAL_API_SECRET:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_WEBHOOK_SECRET=TELEGRAM_WEBHOOK_SECRET:latest'
          BOT_RUN_URL="$(gcloud run services describe nova-bot --region "$REGION" --format='value(status.url)')"
          gcloud run services update nova-bot --region "$REGION" --update-env-vars "TELEGRAM_WEBHOOK_URL=${BOT_RUN_URL}"
          echo "BOT_RUN_URL=$BOT_RUN_URL" >> "$GITHUB_ENV"
      - name: Verify health
        run: |
          set -euo pipefail
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "${API_RUN_URL}/health"
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "${API_RUN_URL}/ready"
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "${BOT_RUN_URL}/health"
