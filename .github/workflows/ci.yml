name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @nova-org/db
      - name: Build workspace packages required by applications
        run: npm run build:packages
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -w @nova-org/api
      - run: npm test -w @nova-org/validator
      - run: npm test -w @nova-org/server-worker
      - run: npm run lint
      - run: npm run format:check
